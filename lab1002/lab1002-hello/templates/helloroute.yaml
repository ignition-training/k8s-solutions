apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name -}}-helloroute
  labels:
    app: hello
    {{- include "recommendedlabels" . | indent 4 }}
spec:
  parentRefs:
  - name: app-gateway
    namespace: course-env
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: {{ .Values.urlPrefix }}
    backendRefs:
    - name: {{ .Release.Name -}}-helloservice 
      port: {{ .Values.servicePort }} 
