apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-route 
  namespace: testuser1
spec:
  parentRefs:
  - name: app-gateway
    namespace: course-env
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /app/testuser1
    backendRefs:
    - name: helloservice 
      port: 5859 
